name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./Analyzer/Analyzer.slnx

      - name: Build
        run: dotnet build ./Analyzer/Analyzer.slnx --no-restore

      - name: Test
        run: dotnet test ./Analyzer/Analyzer.slnx --no-build
